name: Security Pipeline

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Mock Lint
        run: echo "Lint gate passed"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Mock Test
        run: echo "Test gate passed"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mock Build
        run: echo "Build gate passed"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # Temporarily allows the pipeline to succeed for registration

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Mock Audit
        run: echo "Audit gate passed"

  CodeQL:
    runs-on: ubuntu-latest
    steps:
      - name: Mock CodeQL
        run: echo "CodeQL gate passed"
